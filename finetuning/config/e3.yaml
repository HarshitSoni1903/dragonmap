experiment:
  name: "semra_ms_sapbert_v3"
  output_dir: "experiments"

model:
  name_or_path: "models"

data:
  train_csv: "data/sapbert_train.csv"
  val_csv: "data/sapbert_val.csv"
  test_csv: "data/sapbert_test.csv"

training:
  batch_size: 256
  max_seq_length: 16
  epochs: 5
  lr: 3e-5
  weight_decay: 0.01
  eps: 1e-8
  betas: [0.9, 0.999]
  warmup_ratio: 0.1
  fp16: true
  max_grad_norm: 1.0
  gradient_accumulation_steps: 1
  num_workers: 4
  seed: 42
  log_every: 50

loss:
  type: "MultiSimilarity"
  alpha: 2
  beta: 50
  margin: 0.1
  temperature: 0.05
